appId: com.apia.desktop
productName: Apia
copyright: Copyright © 2026 ui2030
asar: true

# Stamp the app icon + version metadata onto Apia.exe (see the hook for why this
# can't use electron-builder's built-in signAndEditExecutable on this machine).
afterPack: scripts/afterPack.cjs

# Step 4 — electron-as-wallpaper ships a Win32 native .node binding
# (Progman → WorkerW + SetParent). Native modules can't be required from
# inside an .asar archive on Windows; electron-builder has to unpack them
# next to the .asar so `require('electron-as-wallpaper')` resolves at run
# time. Pattern matches the package's npm layout (build/release/*.node).
asarUnpack:
  - node_modules/electron-as-wallpaper/**/*

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - node_modules/electron-as-wallpaper/**/*

extraResources:
  - from: backend-dist/ApiaBackend.exe
    to: backend/ApiaBackend.exe
  # Win11 "behind icons" wallpaper helper (Progman-child reparent). Shipped
  # unpacked under resources/scripts so it can be spawned — an .exe can't run
  # from inside the .asar. wallpaperMode.js resolves resourcesPath/scripts first.
  - from: scripts/win-wallpaper.exe
    to: scripts/win-wallpaper.exe

win:
  target:
    - nsis
  executableName: Apia
  icon: build/icon.ico
  # Kept false on purpose: true makes electron-builder fetch the winCodeSign
  # package, whose macOS .dylib symlinks fail to extract on this box (no symlink
  # privilege) and break the build. Consequence: win.icon above is NOT stamped
  # onto Apia.exe — that is done by scripts/afterPack.cjs via a repo-vendored
  # standalone rcedit. win.icon still serves as the app's default icon resource
  # (e.g. the Add/Remove Programs DisplayIcon); the installer-UI icons are set
  # explicitly under nsis: below.
  signAndEditExecutable: false

nsis:
  artifactName: '${productName}-Setup-${version}.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Apia
