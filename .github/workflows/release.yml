# 깨끗한 윈도우 머신(GitHub Actions)에서 설치본을 만든다 — "다른 PC에서 빌드되는가"의 대리 검증.
# 태그(v*)를 밀면 설치본을 깃허브 릴리스에 자동 첨부한다. 수동 실행(workflow_dispatch)도 가능.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: npm ci

      - name: Build app + backend + installer
        shell: pwsh
        env:
          # 패키징 venv의 기반 파이썬 — 개발 PC의 anaconda 대신 러너의 3.11
          APIA_PACKAGING_PYTHON: ${{ steps.py.outputs.python-path }}
          PYTHONUTF8: '1'
        run: npm run dist:win

      - name: Smoke test the packaged app (non-blocking on CI)
        shell: pwsh
        continue-on-error: true
        run: npm run smoke:release

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item release\Apia-Setup-*.exe out\
          Copy-Item THIRD_PARTY_NOTICES.md, PRIVACY.md out\
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: apia-installer
          path: out/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            out/Apia-Setup-*.exe
            out/THIRD_PARTY_NOTICES.md
            out/PRIVACY.md
          body: |
            이 설치 파일은 코드 서명이 되어 있지 않습니다. 처음 실행하면 Windows SmartScreen이
            "Windows의 PC 보호" 경고를 띄울 수 있습니다 — **추가 정보 → 실행**을 누르면 설치됩니다.
            설치·첫 대화·개인정보 안내: 저장소의 docs/user 와 PRIVACY.md
